name: Sync Roadmap

# Keeps ROADMAP.md in sync with GitHub issue states across the three
# Kingdoms repos (see kingdoms#27 and docs/SKILLS/update-roadmap.md).
# On any issue/PR state change, run scripts/sync_roadmap.py and open (or
# update) a single rolling PR with the result. Never pushes to main.

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: roadmap-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always sync from the default branch, even on pull_request events.
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run roadmap sync
        id: sync
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_roadmap.py
          if git diff --quiet ROADMAP.md; then
            echo "Roadmap already in sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update rolling sync PR
        if: steps.sync.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ROADMAP_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require("child_process");
            const sh = (cmd) => execSync(cmd, { stdio: "pipe" }).toString().trim();

            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const defaultBranch = repo.data.default_branch;
            const branch = "automation/roadmap-sync";
            const title = "docs(roadmap): sync with GitHub issues";

            sh(`git config user.name "github-actions[bot]"`);
            sh(`git config user.email "github-actions[bot]@users.noreply.github.com"`);

            // Reuse the rolling branch if it exists; rebase it on the
            // default branch so the PR always contains a single clean diff.
            let branchExists = false;
            try {
              execSync(`git ls-remote --heads origin ${branch}`, { stdio: "pipe" });
              branchExists = sh(`git ls-remote --heads origin ${branch}`).length > 0;
            } catch {}
            if (branchExists) {
              sh(`git fetch origin ${branch} ${defaultBranch}`);
              sh(`git checkout ${branch}`);
              sh(`git reset --hard origin/${defaultBranch}`);
              sh(`git checkout origin/${branch} -- ROADMAP.md || true`);
            } else {
              sh(`git checkout -b ${branch}`);
            }

            sh("git add ROADMAP.md");
            sh(`git commit -m "docs(roadmap): sync with GitHub issues"`);
            sh(`git push --force origin ${branch}`);

            const body = [
              "Automated ROADMAP.md sync with GitHub issue states.",
              "",
              "Trigger: " + context.eventName + (context.payload.action ? " (" + context.payload.action + ")" : ""),
              "",
              "Generated by `scripts/sync_roadmap.py` (workflow `sync-roadmap.yml`, kingdoms#27).",
              "This rolling PR is updated in place; do not stack on it.",
            ].join("\n");

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${context.repo.owner}:${branch}`,
            });
            if (prs.data.length > 0) {
              const pr = prs.data[0];
              if (pr.title !== title) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  title,
                });
              }
              core.info(`Updated rolling PR #${pr.number}`);
            } else {
              const created = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                head: branch,
                base: defaultBranch,
                body,
              });
              core.info(`Created rolling PR #${created.data.number}`);
            }
